name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem. You can write in any language.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a magnet link
        2. Open the Files tab
        3. ...
  - type: input
    id: version
    attributes:
      label: FishTorrnet version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Windows
        - macOS
        - Linux
        - Docker or headless server
        - Phone or browser (remote access)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Do not include magnet links or names of torrents you would rather keep private.
