name: Snap

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["snap/**", ".github/workflows/snap.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snap:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: build
        uses: snapcore/action-build@v1
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "${{ github.ref_name }}" "${{ steps.build.outputs.snap }}" --clobber
      - name: Publish to the Snap Store
        if: startsWith(github.ref, 'refs/tags/v') && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
