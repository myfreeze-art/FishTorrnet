name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TAG: ${{ github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag
        run: python3 packaging/set-version.py "$TAG"
      - id: release
        run: |
          find_release() {
            gh api "repos/${{ github.repository }}/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1
          }
          id=$(find_release)
          if [ -z "$id" ]; then
            gh release create "$TAG" --draft --verify-tag \
              --title "FishTorrnet $TAG" --notes-file packaging/release-notes.md
            id=$(find_release)
          elif [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
            gh release edit "$TAG" --notes-file packaging/release-notes.md
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Set version from tag
        shell: bash
        run: |
          (python3 --version >/dev/null 2>&1 && python3 packaging/set-version.py "$TAG") || python packaging/set-version.py "$TAG"
          cargo update --workspace
      - name: Dependencies
        run: |
          npm ci
          npm ci --prefix ui
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ matrix.args }}
      - name: Microsoft Store package
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $package = ./packaging/msix/build.ps1 -Version $env:TAG
          gh release upload $env:TAG $package --clobber

  server:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: fishtorrnet-server-linux-x86_64
            file: fishtorrnet-server
          - os: ubuntu-22.04-arm
            name: fishtorrnet-server-linux-arm64
            file: fishtorrnet-server
          - os: windows-latest
            name: fishtorrnet-server-windows-x86_64.exe
            file: fishtorrnet-server.exe
          - os: macos-latest
            name: fishtorrnet-server-macos-arm64
            file: fishtorrnet-server
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set version from tag
        shell: bash
        run: |
          (python3 --version >/dev/null 2>&1 && python3 packaging/set-version.py "$TAG") || python packaging/set-version.py "$TAG"
          cargo update --workspace
      - name: Build
        shell: bash
        run: |
          npm ci --prefix ui
          npm --prefix ui run build
          cargo build --release --locked -p fishtorrnet-server
          cp "target/release/${{ matrix.file }}" "${{ matrix.name }}"
          gh release upload "$TAG" "${{ matrix.name }}" --clobber

  checksums:
    needs: [desktop, server]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Checksums and store manifests
        run: |
          mkdir assets
          gh release download "$TAG" --dir assets --skip-existing
          (cd assets && rm -f SHA256SUMS.txt && sha256sum * > ../SHA256SUMS.txt)
          python3 packaging/render.py --version "$TAG" --assets assets --out store
          (cd store && zip -qr "../fishtorrnet-${TAG}-store-manifests.zip" .)
          gh release upload "$TAG" SHA256SUMS.txt "fishtorrnet-${TAG}-store-manifests.zip" --clobber
