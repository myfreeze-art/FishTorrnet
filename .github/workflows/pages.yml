name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "assets/**", "docs/screenshots/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Assemble
        run: |
          mkdir -p public/screenshots
          cp site/index.html public/
          cp assets/logo-dark.svg assets/logo-light.svg public/
          cp docs/screenshots/main-dark.png docs/screenshots/main-light.png public/screenshots/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
