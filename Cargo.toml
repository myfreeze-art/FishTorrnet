[workspace]
resolver = "2"
members = ["crates/engine", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/myfreeze-art/FishTorrnet"

[workspace.dependencies]
fishtorrnet-engine = { path = "crates/engine" }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
librqbit-tracker-comms = { path = "vendor/librqbit-tracker-comms" }
